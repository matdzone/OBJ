<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Tank Battles</title>

	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<div class="container">

		<h1>Tank Battles</h1>

		<div id="login">
			<input id="nameInput"
				   placeholder="Player name">

			<button id="joinButton">
				Join game
			</button>
		</div>

		<div id="game" class="hidden">

			<div class="hud">
				<span id="playerName"></span>
				<span>HP: <span id="healthValue">100</span></span>
				<span>Weapon: <span id="weaponName">Cannon</span></span>
				<span>Shell: <span id="shellName">Straight</span></span>
				<span>W/S drive, A/D turn, Space shoot, 1/2/3 shell</span>
			</div>

			<canvas id="gameCanvas"
					width="800"
					height="400">
			</canvas>

		</div>

	</div>

	<script src="app.js"></script>

</body>
</html>
